<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0A0A0A">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Tap to continue</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0A0A0A;
    --text: #FAFAFA;
    --muted: #8B8B8B;
    --green: #1FEA6A;
    --green-deep: #00D45C;
    --pumpkin: #FF7A1A;
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; background: var(--bg); }
  body {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    color: var(--text);
    -webkit-font-smoothing: antialiased;
    overflow: hidden;
  }

  /* Background glows: green bloom in the middle, ember glow at the bottom */
  .stage {
    position: relative;
    min-height: 100vh;
    min-height: 100dvh;
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: env(safe-area-inset-top, 0px) 22px env(safe-area-inset-bottom, 0px);
    background:
      radial-gradient(ellipse 70% 38% at 50% 34%, rgba(20, 110, 55, .42), transparent 70%),
      radial-gradient(ellipse 80% 22% at 50% 100%, rgba(255, 122, 26, .22), transparent 75%),
      var(--bg);
  }

  .content {
    width: 100%;
    max-width: 480px;
    margin: 0 auto;
    text-align: center;
    padding-top: 22vh;
  }

  h1 {
    font-size: clamp(34px, 9.4vw, 44px);
    font-weight: 800;
    letter-spacing: -0.035em;
    line-height: 1.05;
  }
  p {
    margin: 18px auto 0;
    max-width: 22em;
    font-size: clamp(17px, 4.6vw, 20px);
    font-weight: 400;
    line-height: 1.5;
    color: var(--muted);
  }

  .btn {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    width: 100%;
    margin-top: 38px;
    padding: 21px 20px;
    border: 0;
    border-radius: 22px;
    background: linear-gradient(180deg, var(--green), var(--green-deep));
    color: #fff;
    font: inherit;
    font-size: 22px;
    font-weight: 800;
    letter-spacing: 0.01em;
    text-transform: uppercase;
    cursor: pointer;
    box-shadow: 0 0 0 1px rgba(255,255,255,.12) inset, 0 14px 44px rgba(0, 220, 100, .34);
    animation: pulse 2.4s ease-in-out infinite;
    transition: transform .12s ease;
  }
  .btn:active { transform: scale(.975); }
  .btn:focus-visible { outline: 3px solid #fff; outline-offset: 3px; }
  .btn .arrow { font-weight: 500; }

  @keyframes pulse {
    0%, 100% { box-shadow: 0 0 0 1px rgba(255,255,255,.12) inset, 0 14px 44px rgba(0, 220, 100, .30); }
    50%      { box-shadow: 0 0 0 1px rgba(255,255,255,.12) inset, 0 14px 60px rgba(0, 220, 100, .55); }
  }

  /* Corner pumpkins */
  .pk {
    position: fixed;
    font-size: 40px;
    line-height: 1;
    filter: drop-shadow(0 0 16px rgba(255, 122, 26, .55));
    opacity: .92;
    pointer-events: none;
    animation: bob 5s ease-in-out infinite;
  }
  .pk.tl { top: 15%;  left: 7%;  font-size: 42px; }
  .pk.tr { top: 17%;  right: 7%; font-size: 36px; animation-delay: -1.6s; }
  .pk.bl { bottom: 11%; left: 9%;  font-size: 36px; animation-delay: -3s; }
  .pk.br { bottom: 9%;  right: 8%; font-size: 42px; animation-delay: -.8s; }
  @keyframes bob {
    0%, 100% { transform: translateY(0) rotate(-3deg); }
    50%      { transform: translateY(-10px) rotate(3deg); }
  }

  @media (prefers-reduced-motion: reduce) {
    .btn, .pk { animation: none; }
  }
</style>
</head>
<body>
<main class="stage">
  <span class="pk tl" aria-hidden="true">🎃</span>
  <span class="pk tr" aria-hidden="true">🎃</span>
  <span class="pk bl" aria-hidden="true">🎃</span>
  <span class="pk br" aria-hidden="true">🎃</span>

  <div class="content">
    <h1>Tap to continue</h1>
    <p>Tap the button below to open this page in your browser.</p>
    <button class="btn" id="go" type="button">
      <span aria-hidden="true">🎃</span>
      <span>Continue</span>
      <span class="arrow" aria-hidden="true">→</span>
    </button>
  </div>
</main>

<script>
(function () {
  // ===== SET THIS ONE VALUE =====
  var TARGET_URL = "https://recosocial.securegate.workers.dev/";
  // ==============================

  // Carry over the query string (ttclid, utm_*, etc.) so tracking survives the jump.
  function buildUrl() {
    try {
      var u = new URL(TARGET_URL);
      new URLSearchParams(window.location.search).forEach(function (v, k) {
        if (!u.searchParams.has(k)) u.searchParams.set(k, v);
      });
      return u.toString();
    } catch (e) {
      return TARGET_URL;
    }
  }

  var ua = navigator.userAgent || "";
  var isAndroid = /Android/i.test(ua);
  var isIOS = /iPhone|iPad|iPod/i.test(ua) ||
              (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);

  function openExternal() {
    var url = buildUrl();
    var u;
    try { u = new URL(url); } catch (e) { window.location.href = url; return; }

    if (isAndroid) {
      // Android intent: hands the URL to the default browser instead of the TikTok webview.
      var path = u.host + u.pathname + u.search + u.hash;
      window.location.href =
        "intent://" + path +
        "#Intent;scheme=" + u.protocol.replace(":", "") +
        ";action=android.intent.action.VIEW" +
        ";S.browser_fallback_url=" + encodeURIComponent(url) + ";end";
      return;
    }

    if (isIOS) {
      // iOS has no official escape hatch; try Safari's scheme, then fall back to a normal navigation.
      var fallback = setTimeout(function () { window.location.href = url; }, 900);
      document.addEventListener("visibilitychange", function () {
        if (document.hidden) clearTimeout(fallback);
      });
      window.location.href = "x-safari-" + url;
      return;
    }

    window.location.href = url; // desktop / anything else
  }

  document.getElementById("go").addEventListener("click", openExternal);
})();
</script>
</body>
</html>
